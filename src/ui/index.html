<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width" />
    <title>ETS2 Mod Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-mods" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
        </symbol>
        <symbol id="i-discover" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m15.5 15.5 5 5" />
        </symbol>
        <symbol id="i-builds" viewBox="0 0 24 24">
          <path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z" />
          <path d="m4 12 8 4.5 8-4.5" />
          <path d="m4 16.5 8 4.5 8-4.5" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="M5 7h7M18 7h1M5 17h1M12 17h7" />
          <circle cx="15" cy="7" r="2.2" />
          <circle cx="9" cy="17" r="2.2" />
        </symbol>
        <symbol id="i-package" viewBox="0 0 24 24">
          <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z" />
          <path d="M4 7.5 12 12l8-4.5M12 12v9" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="m8.2 12.2 2.5 2.5 5.1-5.4" />
        </symbol>
        <symbol id="i-warning" viewBox="0 0 24 24">
          <path d="M12 4.2 3.4 19h17.2L12 4.2Z" />
          <path d="M12 9v4.2M12 16.3v.1" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2.5h6a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17V7.5Z" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 4.5V11h-6.5" />
        </symbol>
        <symbol id="i-import" viewBox="0 0 24 24">
          <path d="M12 3v11" />
          <path d="m8 10 4 4 4-4" />
          <path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5" />
        </symbol>
      </defs>
    </svg>
    <aside class="nav" aria-label="Navigation principale">
      <div class="brand">
        <span class="mark" aria-hidden="true">E2</span>
        <div class="brand-text">
          <strong>MOD MANAGER</strong>
          <small>EURO TRUCK SIMULATOR 2</small>
        </div>
      </div>
      <div class="nav-label">Votre espace</div>
      <button type="button" data-view="library" class="active" aria-current="page">
        <svg class="icon" aria-hidden="true"><use href="#i-mods"></use></svg>
        <span>Mes mods</span>
      </button>
      <button type="button" data-view="discover">
        <svg class="icon" aria-hidden="true"><use href="#i-discover"></use></svg>
        <span>Découvrir</span>
      </button>
      <button type="button" data-view="builds">
        <svg class="icon" aria-hidden="true"><use href="#i-builds"></use></svg>
        <span>Mes configurations</span>
      </button>
      <div class="nav-bottom">
        <button type="button" data-view="settings">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
          <span>Paramètres</span>
        </button>
        <div class="route-card">
          <span>Votre route.</span>
          <strong>Votre configuration.</strong>
          <small>VERSION 0.1 · LOCAL</small>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <div class="headline">
          <span class="eyebrow">Votre garage numérique</span>
          <h1 id="title">Mes mods</h1>
        </div>
        <div class="target">
          <label for="target">Version cible ETS 2</label
          ><input
            id="target"
            placeholder="1.61.1.9"
            aria-label="Version cible"
          /><small id="target-hint">Analyse des déclarations des auteurs</small>
        </div>
      </header>
      <div id="notice" role="status"></div>
      <main id="content"></main>
      <footer>
        <span id="status">Prêt</span
        ><span
          >Les déclarations de compatibilité ne garantissent pas le
          fonctionnement en jeu.</span
        >
      </footer>
    </div>
    <dialog id="detail">
      <button id="close-detail" class="close" type="button" aria-label="Fermer">✕</button>
      <div id="detail-body"></div>
    </dialog>
    <dialog id="name-dialog">
      <form method="dialog">
        <h2 id="name-title">Configuration</h2>
        <div class="field">
          <input
            id="name-input"
            aria-label="Nom de la configuration"
            maxlength="100"
            required
          />
        </div>
        <button value="cancel" formnovalidate>Annuler</button>
        <button value="ok" class="primary">Enregistrer</button>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
